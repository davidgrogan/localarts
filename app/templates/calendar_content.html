{# Everything inside calendar.html's #calendar-content -- split out into
   its own file so main.py's calendar() route can render *just* this
   (no <html>/nav/footer chrome) for the AJAX fetch()es calendar.html's
   own <script> makes on every filter change / view switch / month-nav
   click, while a real full-page load (typing the URL, a bookmark, a
   fresh visit, "open in new tab") still gets the complete page via
   calendar.html including this same file. Same render_template() call,
   same context either way -- see calendar()'s own comment in
   app/routes/main.py for how the two template names get chosen.

   Every link in here that should re-run the calendar (view toggle,
   month prev/next, "+N more", "Clear filters", the empty-state's own
   "List All" link) carries class="calendar-nav-link" -- that's the
   marker calendar.html's delegated click handler looks for to hijack it
   into a fetch() instead of a real navigation. Anything *without* that
   class (event detail links, artist links, ticket/venue links, ICS
   downloads, admin edit/delete) is a real link and navigates normally,
   full stop -- the delegation only ever checks for the marker class, it
   never tries to guess from the URL shape. #}
  <p class="hero-note" style="margin-bottom: 1.25rem;"><strong>{{ venue_caution_note }}</strong></p>

  {% if artists_this_week %}
    {# Every local artist's appearance at a show landing in this same
       7-day window (see main.py's _local_artists_playing_this_week()) --
       one card per (artist, show) pair, so an artist playing twice this
       week (or a bill with more than one local act) gets a card each.
       Replaces the old single-random-artist spotlight. The gallery itself
       is a plain horizontally-scrolling flex row (CSS scroll-snap) so it
       works via touch/trackpad swipe with no JS at all -- the Prev/Next
       buttons below are just a more discoverable way to do the same
       scroll, (re-)wired up by calendar.html's initArtistWeekGallery(),
       called once on page load and again after every AJAX swap since
       this whole block (and its DOM nodes) gets replaced each time. #}
    <details class="featured-artist" id="artists-this-week-details" open>
      <summary>Local Artists Playing This Week! <span class="toggle-icon" aria-hidden="true">&#9660;</span></summary>
      <div class="artist-week-gallery-wrap">
        <div class="artist-week-gallery" id="artist-week-gallery">
          {% for spot in artists_this_week %}
            {% set artist = spot.artist %}
            {% set e = spot.event %}
            <div class="artist-week-card">
              {% if artist.image_url %}
                <div class="artist-thumb featured-artist-thumb"><img src="{{ artist.image_url }}" alt="" loading="lazy"></div>
              {% endif %}
              <p class="meta">
                At
                {% if e.display_venue_link %}
                  <a href="{{ e.display_venue_link }}" target="_blank" rel="noopener">{{ e.display_venue_name }}</a>
                {% else %}
                  {{ e.display_venue_name }}
                {% endif %}
                on {{ e.start_datetime | dtfmt("%a %b %-d, %-I:%M %p") }}
              </p>
              <h3>{{ artist.name }}</h3>
              {% if artist.genre_tags %}
                <p class="meta">
                  {% for g in artist.genre_tags %}<span class="genre-tag">{{ g.name }}</span>{% endfor %}
                </p>
              {% endif %}
              {% if artist.embed_code %}
                <div class="artist-embed">{{ artist.embed_code | safe }}</div>
              {% endif %}
              <a class="btn btn-small" href="{{ url_for('artists.detail', artist_id=artist.id) }}">View artist profile &rarr;</a>
            </div>
          {% endfor %}
        </div>
        {% if artists_this_week | length > 1 %}
          {# Server-side this only knows the *count* of cards, not whether
             they'll actually overflow the gallery's width -- on a wide
             enough screen, 2 (or even 3) cards fit side by side with
             nothing to scroll to, and the Prev/Next/"1 of 2" counter below
             would be actively misleading in that case (a visitor can
             already see every card, so "1 of 2" reads like there's a
             second screen's worth of content hiding behind Next).
             calendar.html's initArtistWeekGallery() hides this whole
             block with JS once the page has actually laid out, if the
             gallery isn't scrollable -- see that function's own
             updateNavVisibility(). #}
          <div class="artist-week-nav" id="artist-week-nav">
            <button type="button" class="btn btn-small btn-secondary" id="artist-week-prev" aria-label="Previous artist">&larr; Prev</button>
            <span class="artist-week-count" id="artist-week-count"></span>
            <button type="button" class="btn btn-small btn-secondary" id="artist-week-next" aria-label="Next artist">Next &rarr;</button>
          </div>
        {% endif %}
      </div>
    </details>
  {% endif %}

  <h2 class="section-heading">Upcoming shows</h2>
  {% if view == 'week' %}
    <p class="meta">Showing {{ week_start | dtfmt("%b %-d") }}&ndash;{{ week_end | dtfmt("%b %-d") }}.</p>
  {% elif view == 'weekend' %}
    <p class="meta">Showing {{ weekend_start | dtfmt("%b %-d") }}&ndash;{{ weekend_end | dtfmt("%b %-d") }}.</p>
  {% endif %}

  {# One toggleable pill per public category (see EventType.is_public_category
     in models.py and the "Manage categories" admin page) -- Music is
     checked by default on a fresh visit, every other category opt-in.
     Deliberately its own row, above the rest of the filter bar: this is
     now the primary "what kind of thing am I looking at" choice, not a
     secondary refinement like venue/genre. Lives inside the same <form>
     below (the fieldset tag doesn't break that), so checking/unchecking
     a pill submits the whole filter bar together.

     No more onchange="this.form.submit()" anywhere in this form (that
     used to trigger a real full-page GET) -- calendar.html's delegated
     "change" listener on document handles every one of these controls
     now, building the equivalent query string itself and fetching it
     instead. That listener lives outside this fragment (on document, not
     inside #calendar-content), so it survives every AJAX swap even
     though this whole <form> gets replaced along with everything else in
     here on each one. A visitor with JS disabled can still submit this
     form the plain native way (method="get" is still real) -- they'd
     just need an explicit submit control to do it, since there's
     intentionally no button here; this project already assumes JS
     elsewhere (the month popup, the artist-week gallery), so that's a
     accepted trade-off, not an oversight. #}
  <form class="filters" method="get">
    <input type="hidden" id="view-field" name="view" value="{{ view }}">
    {# Free-text search against a show's title or any billed artist's
       name (see _base_query()'s own docstring in main.py) -- its own
       full-width row above the category pills, since it's the control
       most visitors reach for first ("is there a show I'm looking for")
       rather than a secondary refinement. type="search" for the native
       clear-("x")-button most browsers render, and so it participates in
       the same delegated "input"/"submit" handling as everything else in
       this form -- see calendar.html's own comment on why a plain text
       field needs its own submit-interception, unlike the checkboxes and
       selects here that only ever fire "change". #}
    <input type="search" name="q" class="calendar-search" value="{{ selected_search or '' }}" placeholder="Search shows or artists&hellip;" aria-label="Search shows or artists">
    {# Distinguishes "the filter form was submitted with every category
       pill unchecked" from "this is a fresh visit that never touched the
       filter bar" -- see _resolve_selected_category_ids()'s docstring in
       main.py for why that distinction matters. Every submission of this
       form includes it, since it's a plain (non-checkbox) hidden field --
       EXCEPT when the venue dropdown below disables it right before
       submitting, on purpose, so picking a venue defaults to every public
       category instead of collapsing back to just Music. #}
    <input type="hidden" id="categories-submitted-field" name="categories_submitted" value="1">
    {% if public_categories %}
      <fieldset class="category-toggles">
        {% for c in public_categories %}
          <label class="category-pill">
            <input type="checkbox" name="category" value="{{ c.id }}"
              {% if c.id in selected_category_ids %}checked{% endif %}>
            {{ c.name }}
          </label>
        {% endfor %}
        {# "Select all" -- checks every category pill above and submits,
           same as checking each one by hand. A plain <button>, not a
           link, since it's an action on this form rather than navigation
           anywhere -- calendar.html's delegated click handler looks for
           this specific class the same way it looks for
           calendar-nav-link on real links. Paired right next to it,
           "Clear" does the opposite (unchecks every pill) -- the two
           live together since they're each other's undo, rather than
           "Clear" being lumped in with the broader "Clear filters" link
           further down (which also resets venue/genre/local-artist). #}
        <button type="button" class="link-button category-select-all">Select all</button>
        <button type="button" class="link-button category-clear-all">Clear</button>
      </fieldset>
    {% endif %}
    {# "More filters" wraps the secondary filter controls (venue, genre,
       local-artist toggle, "Clear filters") in a collapsible panel, same
       native <details>/<summary> pattern as .featured-artist above, so
       they don't compete for attention with the category pills (the
       primary filter, deliberately left outside this panel and always
       visible -- see the fieldset's own comment above). Remembered via
       localStorage the same way "Local Artists Playing This Week" is
       (see calendar.html's initRememberOpenState()), and defaults to open
       on a wide-enough screen / collapsed on a narrow one the first time
       a visitor shows up, before there's any stored preference yet. #}
    <details class="filters-more" id="filters-more-details" open>
      <summary>More filters <span class="toggle-icon" aria-hidden="true">&#9660;</span></summary>
      <div class="filters-more-body">
    {# Disabling the categories_submitted hidden field before this
       particular submit (a disabled field just doesn't get included in
       the form data -- standard HTML behavior, nothing server-side to
       undo) makes _resolve_selected_category_ids() treat picking a venue
       as a "fresh" categories state, same as a first-ever visit -- except
       with venue_selected=True this time, so it defaults to showing every
       public category for that venue rather than falling back to Music.
       Whatever pills happen to be checked still get submitted alongside
       it, but the resolver ignores the "category" param entirely whenever
       categories_submitted is missing, so that's harmless. #}
    <select name="venue">
      <option value="">All venues</option>
      {% for v in venues %}
        <option value="{{ v.id }}" {% if v.id == selected_venue %}selected{% endif %}>{{ v.name }}</option>
      {% endfor %}
    </select>
    <!-- Local artist filter removed for now -- coming back to this later. -->
    <select name="genre">
      <option value="">All genres</option>
      {% for g in genres %}
        <option value="{{ g }}" {% if g == selected_genre %}selected{% endif %}>{{ g }}</option>
      {% endfor %}
    </select>
    <!-- "Only show first date of recurring events" toggle hidden for now,
         per David's ask -- the underlying hide_recurring query param,
         main.py's GROUP_RECURRING_EVENTS grouping logic, and the
         view-toggle/clear-filters links below are all untouched, so this
         is a one-line uncomment to bring the checkbox back later.
    <label class="recurring-toggle">
      <input type="checkbox" name="hide_recurring" value="1" {% if hide_recurring %}checked{% endif %}>
      Only show first date of recurring events
    </label>
    -->
    <label class="recurring-toggle">
      <input type="checkbox" name="only_local_artists" value="1" {% if only_local_artists %}checked{% endif %}>
      Show only events with local artists
    </label>
    {% if selected_venue or selected_genre or selected_search or hide_recurring or only_local_artists or categories_customized %}
      <a class="clear calendar-nav-link" href="{{ url_for('main.calendar', view=view) }}">Clear filters</a>
    {% endif %}
      </div>
    </details>
  </form>

  {# Every one of these links carries category=selected_category_ids
     (url_for repeats a list value as one "category=" param per id) plus
     categories_submitted=1, so switching view/month/page never silently
     resets back to the Music-only default -- whatever's currently
     selected stays selected.

     Sticky (see .view-toggle's own CSS) so it stays put while a long
     event-list/month-grid scrolls underneath it, rather than a visitor
     having to scroll all the way back to the top just to switch view.
     (An earlier version of this bar also had a "Filters" button that
     jumped back up to "More filters" -- removed as more clutter than it
     was worth once it turned out to rarely do anything visitor-visible
     unless you'd scrolled deep into a long list first.) #}
  <div class="view-toggle">
    <a class="btn btn-small calendar-nav-link {{ '' if view == 'week' else 'btn-secondary' }}" href="{{ url_for('main.calendar', view='week', venue=selected_venue, genre=selected_genre, q=selected_search, hide_recurring=('1' if hide_recurring else none), only_local_artists=('1' if only_local_artists else none), category=selected_category_ids, categories_submitted=1) }}">Next 7 Days</a>
    <a class="btn btn-small calendar-nav-link {{ '' if view == 'weekend' else 'btn-secondary' }}" href="{{ url_for('main.calendar', view='weekend', venue=selected_venue, genre=selected_genre, q=selected_search, hide_recurring=('1' if hide_recurring else none), only_local_artists=('1' if only_local_artists else none), category=selected_category_ids, categories_submitted=1) }}">This Weekend</a>
    <a class="btn btn-small calendar-nav-link {{ '' if view == 'month' else 'btn-secondary' }}" href="{{ url_for('main.calendar', view='month', venue=selected_venue, genre=selected_genre, q=selected_search, only_local_artists=('1' if only_local_artists else none), category=selected_category_ids, categories_submitted=1) }}">Month</a>
    <a class="btn btn-small calendar-nav-link {{ '' if view == 'list' else 'btn-secondary' }}" href="{{ url_for('main.calendar', view='list', venue=selected_venue, genre=selected_genre, q=selected_search, hide_recurring=('1' if hide_recurring else none), only_local_artists=('1' if only_local_artists else none), category=selected_category_ids, categories_submitted=1) }}">List All</a>
  </div>

  {% if view == 'month' %}
    <div class="month-nav">
      <a class="calendar-nav-link" href="{{ url_for('main.calendar', view='month', month=grid.prev_month, venue=selected_venue, genre=selected_genre, q=selected_search, only_local_artists=('1' if only_local_artists else none), category=selected_category_ids, categories_submitted=1) }}">&larr; Prev</a>
      <span class="month-label">{{ grid.month_name }}</span>
      <a class="calendar-nav-link" href="{{ url_for('main.calendar', view='month', month=grid.next_month, venue=selected_venue, genre=selected_genre, q=selected_search, only_local_artists=('1' if only_local_artists else none), category=selected_category_ids, categories_submitted=1) }}">Next &rarr;</a>
    </div>

    {# Hover/focus popup for a grid-event link (see calendar.html's
       initMonthPopup()) -- a day cell only has room for time + title, so
       this is where the rest (image, venue, artists, description) shows
       up without a click-through to the full event page. One shared,
       empty element reused for whichever event is currently
       hovered/focused, positioned and filled in by JS rather than one
       pre-rendered per event (cheaper, and avoids fighting each day
       cell's own overflow:hidden/scroll, which would otherwise clip a
       popup nested inside it). #}
    <div id="event-popup" class="event-popup" role="tooltip"></div>

    <table class="month-grid">
      <thead>
        <tr><th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr>
      </thead>
      <tbody>
        {% for week in grid.weeks %}
          <tr>
            {% for day in week %}
              {% if day == 0 %}
                <td class="empty-day"></td>
              {% else %}
                <td class="{{ 'today' if day == grid.today_day else '' }}">
                  <div class="day-number">{{ day }}</div>
                  <div class="day-events">
                    {% for e in grid.events_by_day.get(day, []) %}
                      {% set local_artists = e.artists | selectattr("is_local") | list %}
                      {% set popup_image = (e.image_url if e.image_url else (e.venue.image_url if e.venue.image_url else '')) | resolve_image_url %}
                      <div class="grid-event {{ 'grid-event-local' if local_artists else '' }}">
                        {% if local_artists %}<span class="grid-local-star">&#9733;</span>{% endif %}
                        {% if e.genre %}<span class="grid-genre-dot"></span>{% endif %}
                        <a
                          class="grid-event-link"
                          href="{{ url_for('main.event_detail', event_id=e.id) }}"
                          data-title="{{ e.title }}"
                          data-time="{{ e.start_datetime | dtfmt('%a %b %-d, %-I:%M %p') }}"
                          data-venue="{{ e.display_venue_name }}"
                          {% if e.venue.city and not e.custom_venue_name %}data-citystate="{{ e.venue.city }}, {{ e.venue.state }}"{% endif %}
                          {% if e.genre %}data-genre="{{ e.genre }}"{% endif %}
                          {% if e.artists %}data-artists="{{ e.artists | map(attribute='name') | join(', ') }}"{% endif %}
                          {% if local_artists %}data-local="1"{% endif %}
                          {% if e.description %}data-description="{{ e.description | striptags | truncate(160) }}"{% endif %}
                          {% if popup_image %}data-image="{{ popup_image }}"{% endif %}
                        >{{ e.start_datetime | dtfmt("%-I:%M %p") }} {{ e.title }}</a>
                      </div>
                    {% endfor %}
                    {% if grid.overflow_by_day.get(day) %}
                      {# Caps how many shows render inline per day (see
                         _build_month_grid()'s docstring in main.py for why
                         -- the original month view got pulled for exactly
                         this reason once the venue list grew). "List All"
                         is the honest way to see literally every show on a
                         packed day, so this links there rather than
                         claiming to expand in place. #}
                      <a class="grid-event-overflow calendar-nav-link" href="{{ url_for('main.calendar', view='list', venue=selected_venue, genre=selected_genre, q=selected_search, only_local_artists=('1' if only_local_artists else none), category=selected_category_ids, categories_submitted=1) }}">+{{ grid.overflow_by_day[day] }} more</a>
                    {% endif %}
                  </div>
                </td>
              {% endif %}
            {% endfor %}
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    {% if items %}
      <ul class="event-list">
        {% set ns = namespace(current_day=None) %}
        {% for item in items %}
          {% set e = item.event %}
          {% set day_key = e.start_datetime.date() %}
          {% if day_key != ns.current_day %}
            {% set ns.current_day = day_key %}
            <li class="day-header">
              {% if today and day_key == today.date() %}
                Today &mdash; {{ e.start_datetime | dtfmt("%A, %B %-d") }}
              {% elif tomorrow and day_key == tomorrow %}
                Tomorrow &mdash; {{ e.start_datetime | dtfmt("%A, %B %-d") }}
              {% else %}
                {{ e.start_datetime | dtfmt("%A, %B %-d") }}
              {% endif %}
            </li>
          {% endif %}
          {% set local_artists = e.artists | selectattr("is_local") | list %}
          <li class="event-card {{ 'event-card-local' if local_artists else '' }}">
            <div class="event-date">{{ e.start_datetime | dtfmt("%-I:%M %p") }}</div>
            {# A show with no flyer of its own falls back to its venue's
               photo (e.g. the room, the marquee -- see Venue.image_url,
               set on the venue's own edit page) before falling all the
               way back to the bare site logo -- so cards for venues that
               bothered to add a photo don't look as blank as an event
               that truly has nothing to show. #}
            {% if e.image_url %}
              <a class="event-thumb" href="{{ url_for('main.event_detail', event_id=e.id) }}"><img src="{{ e.image_url | resolve_image_url }}" alt="" loading="lazy"></a>
            {% elif e.venue.image_url %}
              <a class="event-thumb" href="{{ url_for('main.event_detail', event_id=e.id) }}"><img src="{{ e.venue.image_url | resolve_image_url }}" alt="" loading="lazy"></a>
            {% else %}
              <a class="event-thumb event-thumb-fallback" href="{{ url_for('main.event_detail', event_id=e.id) }}"><img src="{{ url_for('static', filename='logo.svg') }}" alt="" loading="lazy"></a>
            {% endif %}
            <div class="event-main">
              <div class="event-title">
                {% if e.ticket_url %}<a href="{{ e.ticket_url }}" target="_blank" rel="noopener" {% if e.description %}title="{{ e.description }}" class="has-description"{% endif %}>{{ e.title }}</a>{% else %}<span {% if e.description %}title="{{ e.description }}" class="has-description"{% endif %}>{{ e.title }}</span>{% endif %}
                {% if item.is_series %}
                  <span class="recurring-badge" title="{{ item.count }} dates total">
                    &#8635; {{ item.badge or "Recurring" }}{% if item.range_end %} &middot; thru {{ item.range_end | dtfmt("%b %-d") }}{% endif %}
                  </span>
                {% endif %}
                {% if local_artists %}<span class="local-artist-badge" title="Features {{ local_artists | map(attribute='name') | join(', ') }}">&#9733; Local Artist</span>{% endif %}
                {% if e.genre %}<span class="genre-tag">{{ e.genre }}</span>{% endif %}
                {# Category pills (Music/Comedy/Theater/etc, distinct from
                   the genre pill above -- .type-tag's teal vs .genre-tag's
                   clay) only show once more than one category is
                   selected at once. With just Music selected (the common
                   case, and the default), every card would carry the
                   same redundant "Music" badge -- the exact reason these
                   were removed entirely during the site's original
                   Music-only pivot. Now that multiple categories can be
                   visible together, they're genuinely useful again for
                   telling a Comedy card apart from a Music one at a
                   glance. Only an event's *public* category tags show
                   here -- an internal-only tag (e.g. "karaoke") never
                   surfaces on the public calendar regardless. #}
                {% if selected_category_ids | length > 1 %}
                  {% for t in e.event_types | selectattr("is_public_category") %}
                    <span class="type-tag">{{ t.name }}</span>
                  {% endfor %}
                {% endif %}
              </div>
              {% set showtimes = e.description | showtimes_line %}
              {% if showtimes %}
                {# Currently only ever set for Amherst Cinema's films --
                   see showtimes_line()'s docstring in app/utils.py for
                   why this is scoped to that one leading-paragraph shape
                   rather than showing an arbitrary description preview
                   under every event's title (Quonk's descriptions in
                   particular are full paragraphs that would blow up
                   every card). A no-op span for every other venue. #}
                <div class="event-showtimes">{{ showtimes }}</div>
              {% endif %}
              <div class="event-venue">
                {% if e.display_venue_link %}
                  <a href="{{ e.display_venue_link }}" target="_blank" rel="noopener">{{ e.display_venue_name }}</a>
                {% else %}
                  {{ e.display_venue_name }}
                {% endif %}
                {# City/state belong to the placeholder Venue (e.g. "DIY"),
                   not the one-off spot itself, so they're suppressed once
                   custom_venue_name is set -- same reasoning as
                   display_venue_link's docstring in models.py. #}
                {% if e.venue.city and not e.custom_venue_name %} &middot; {{ e.venue.city }}, {{ e.venue.state }}{% endif %}
              </div>
              {% if e.artists %}
                <div class="event-artists">
                  Featuring:
                  {% for a in e.artists %}
                    <a href="{{ url_for('artists.detail', artist_id=a.id) }}">{{ a.name }}</a>{% if not loop.last %}, {% endif %}
                  {% endfor %}
                </div>
              {% endif %}
              <div class="event-link">
                <a href="{{ url_for('main.event_detail', event_id=e.id) }}">Event Details &rarr;</a>
                {% if e.ticket_url %}
                  &middot; <a href="{{ e.ticket_url }}" target="_blank" rel="noopener">View on venue site &rarr;</a>
                {% endif %}
                {# Links this one occurrence, not the whole recurring series
                   (see item.is_series below) -- a series' own start/end
                   date range isn't a single calendar-app-importable event,
                   just this card's specific date/time, same as
                   "Event Details" above already only ever points at this
                   one occurrence's own Event row. #}
                &middot; <a href="{{ url_for('main.event_ics', event_id=e.id) }}">Add to calendar</a>
              </div>
              {% if is_admin %}
                <div class="event-actions">
                  {% if not e.artists %}
                    <a href="{{ url_for('artists.new_artist', from_event=e.id) }}">+ Add as local artist</a>
                  {% endif %}
                  <a href="{{ url_for('events.edit_event', event_id=e.id) }}">Edit</a>
                  <form method="post" action="{{ url_for('events.delete_event', event_id=e.id) }}" onsubmit="return confirm('Delete this show?');">
                    <button type="submit">Delete</button>
                  </form>
                  {% if item.is_series %}
                    <span class="meta">(editing/deleting only affects this one occurrence, {{ item.count }} total)</span>
                  {% endif %}
                </div>
              {% endif %}
            </div>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p class="empty-state">
        {% if not selected_category_ids %}
          {# Every category pill unchecked -- literally nothing to show,
             distinct from "no shows found in the ones you picked." #}
          Select at least one category above to see shows.
        {% elif view == 'week' %}
          No shows in the next 7 days. Try <a class="calendar-nav-link" href="{{ url_for('main.calendar', view='list', venue=selected_venue, genre=selected_genre, q=selected_search, only_local_artists=('1' if only_local_artists else none)) }}">List All</a> to see what's further out.
        {% elif view == 'weekend' %}
          No shows this weekend. Try <a class="calendar-nav-link" href="{{ url_for('main.calendar', view='list', venue=selected_venue, genre=selected_genre, q=selected_search, only_local_artists=('1' if only_local_artists else none)) }}">List All</a> to see what's further out.
        {% elif is_admin %}
          No upcoming shows yet. <a href="{{ url_for('events.new_event') }}">Add one</a>, or add a venue and try a scrape.
        {% else %}
          No upcoming shows yet -- check back soon.
        {% endif %}
      </p>
    {% endif %}
  {% endif %}
